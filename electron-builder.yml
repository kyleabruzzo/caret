appId: dev.caret.app
productName: caret
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
  - "!**/.vscode/*"
  - "!**/{.eslintrc.cjs,.gitignore,.prettierrc,README.md,LICENSE}"
  - "!**/tsconfig*.json"
win:
  target:
    - target: nsis
      arch: x64
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
linux:
  target:
    - target: AppImage
      arch: x64
  category: Development
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
